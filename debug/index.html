<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webgpu-geo · 栅格瓦片测试</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #0c1014; }
        /* #map { position: absolute; inset: 0; display: block; } */
        #map { width: 100%; height: 100%; display: block; }
        .hud {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,.6); color: #fff;
            padding: 10px 12px; border-radius: 6px;
            font: 12px/1.5 -apple-system, "Segoe UI", sans-serif;
            user-select: none; pointer-events: none;
        }
        .hud b { color: #6cf; }
        .attribution {
            position: absolute; bottom: 4px; right: 6px;
            background: rgba(255,255,255,.7); color: #333;
            font: 11px sans-serif; padding: 2px 6px; border-radius: 3px;
        }
    </style>
</head>
<body>
    <canvas id="map"></canvas>
    <div class="hud">
        <div>拖拽：平移　滚轮：缩放</div>
        <div>center: <b id="center">-</b></div>
        <div>zoom:   <b id="zoom">-</b></div>
        <div>proj:   <b id="proj">-</b></div>
        <div style="margin-top:6px;pointer-events:auto">
            <button id="btn-2d" style="cursor:pointer">2D 平面</button>
            <button id="btn-3d" style="cursor:pointer">3D 球体</button>
        </div>
    </div>
    <div class="attribution">© OpenStreetMap contributors</div>

    <script>document.write('<script src="../dist/aimap-dev.umd.js?v=' + Date.now() + '"><\/script>');</script>
    <script>
        (async function () {
            const map = new ai.Map({
                container: 'map',
                center: { lng: 116.4074, lat: 39.9042 },
                zoom: 4,
                minZoom: 0,
                maxZoom: 19,
                projection: 'mercator',
                tileSource: {
                    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                    subdomains: ['a', 'b', 'c'],
                    attribution: '© OpenStreetMap'
                }
            });
            await map.ready();

            const $c = document.getElementById('center');
            const $z = document.getElementById('zoom');
            const $p = document.getElementById('proj');
            function updateHud() {
                const c = map.getCenter();
                $c.textContent = c.lng.toFixed(4) + ', ' + c.lat.toFixed(4);
                $z.textContent = map.getZoom().toFixed(2);
                $p.textContent = map.getProjection();
            }
            map.camera.onChange(updateHud);
            updateHud();

            document.getElementById('btn-2d').onclick = () => map.setProjection('mercator');
            document.getElementById('btn-3d').onclick = () => map.setProjection('globe');

            window.map = map;
        })().catch(function (err) {
            document.body.innerHTML = '<div style="color:#fff;padding:24px;font-family:sans-serif">' +
                '<h2>初始化失败</h2><pre>' + err.stack + '</pre></div>';
        });
    </script>
</body>
</html>
